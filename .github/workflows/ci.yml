name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: doordash_decider_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DD_DECIDER_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/doordash_decider_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Python deps
        run: pip install -r ml_service/requirements-dev.txt

      - name: DB migrate (test)
        run: npm run db:migrate:test

      - name: Lint
        run: npm run lint

      - name: Python format check
        run: black --check ml_service ml-service/tests

      - name: Python tests
        run: pytest ml-service/tests

      - name: Test
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Build server
        run: npm run build:server

      - name: Docker build (server/frontend/ml)
        run: |
          docker build -f infra/docker/Dockerfile.server -t dd-decider/server:ci .
          docker build -f infra/docker/Dockerfile.frontend -t dd-decider/frontend:ci .
          docker build -f infra/docker/Dockerfile.ml -t dd-decider/ml:ci .

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
