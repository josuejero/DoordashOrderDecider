pipeline:
  lint:
    image: node:20
    commands:
      - npm ci
      - npm run lint

  test:
    image: node:20
    commands:
      - npm ci
      - npm run db:migrate:test
      - npm run test -- --coverage

  build:
    image: node:20
    commands:
      - npm ci
      - npm run build
      - npm run build:server

  docker-build:
    image: docker:27-dind
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_BUILDKIT=1
    commands:
      - docker build -f infra/docker/Dockerfile.server -t dd-decider/server:${CI_COMMIT_SHA} .
      - docker build -f infra/docker/Dockerfile.ml -t dd-decider/ml-service:${CI_COMMIT_SHA} .
      # push to your registry if you have one
      # docker push ...

  deploy:
    image: alpine/k8s:1.30.0
    environment:
      - KUBECONFIG=/root/.kube/config
    commands:
      - kubectl apply -f infra/k8s/base/config.yaml
      - kubectl apply -f infra/k8s/base/postgres.yaml
      - kubectl apply -f infra/k8s/base/ml-service.yaml
      - kubectl apply -f infra/k8s/base/backend.yaml
