apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dd-app
  namespace: dd-app
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.dd-decider.local
        - ml.dd-decider.local
      secretName: dd-app-tls
  rules:
    - host: api.dd-decider.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dd-backend
                port:
                  name: http
    - host: ml.dd-decider.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dd-ml-service
                port:
                  name: http
