apiVersion: v1
kind: Service
metadata:
  name: dd-ml-service
  namespace: dd-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: dd-ml-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-ml-service
  namespace: dd-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dd-ml-service
  template:
    metadata:
      labels:
        app: dd-ml-service
    spec:
      containers:
        - name: ml-service
          image: dd-decider/ml-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dd-app-config
            - secretRef:
                name: dd-db-secret
          env:
            - name: PORT
              value: "8000"
            - name: MODEL_PATH
              value: /models/model.pkl
            - name: MODEL_METADATA_PATH
              value: /models/model_metadata.json
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: model-artifacts
              mountPath: /models
      volumes:
        - name: model-artifacts
          persistentVolumeClaim:
            claimName: dd-ml-artifacts
