apiVersion: v1
kind: Service
metadata:
  name: dd-ml-service
  namespace: dd-app
spec:
  selector:
    app: dd-ml-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-ml-service
  namespace: dd-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dd-ml-service
  template:
    metadata:
      labels:
        app: dd-ml-service
    spec:
      containers:
        - name: ml-service
          image: dd-decider/ml-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8000"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
