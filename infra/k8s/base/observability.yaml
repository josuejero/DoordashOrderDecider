apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-prometheus-config
  namespace: dd-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: dd-backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - dd-backend.dd-app.svc.cluster.local:4000
      - job_name: dd-ml-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - dd-ml-service.dd-app.svc.cluster.local:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-prometheus
  namespace: dd-observability
  labels:
    app: dd-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dd-prometheus
  template:
    metadata:
      labels:
        app: dd-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: dd-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dd-prometheus
  namespace: dd-observability
spec:
  selector:
    app: dd-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Secret
metadata:
  name: dd-grafana-admin
  namespace: dd-observability
type: Opaque
stringData:
  password: admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-grafana-datasources
  namespace: dd-observability
  labels:
    grafana_datasource: "1"
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://dd-prometheus.dd-observability.svc.cluster.local:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-grafana
  namespace: dd-observability
  labels:
    app: dd-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dd-grafana
  template:
    metadata:
      labels:
        app: dd-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.3
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dd-grafana-admin
                  key: password
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap:
            name: dd-grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: dd-grafana
  namespace: dd-observability
spec:
  selector:
    app: dd-grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
