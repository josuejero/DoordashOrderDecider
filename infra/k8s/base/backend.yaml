apiVersion: v1
kind: Service
metadata:
  name: dd-backend
  namespace: dd-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: dd-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-backend
  namespace: dd-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dd-backend
  template:
    metadata:
      labels:
        app: dd-backend
    spec:
      containers:
        - name: backend
          image: dd-decider/server:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dd-app-config
            - secretRef:
                name: dd-db-secret
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 20
