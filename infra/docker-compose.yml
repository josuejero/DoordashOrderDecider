version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dd-postgres
    environment:
      POSTGRES_DB: doordash_decider_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.server
    container_name: dd-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/doordash_decider_dev
      DD_DECIDER_DATABASE_URL: postgres://postgres:postgres@postgres:5432/doordash_decider_dev
      ML_SERVICE_URL: http://ml-service:8000
      ENABLE_ANALYTICS_API: "true"
    depends_on:
      - postgres
      - ml-service
    ports:
      - "4000:4000"

  ml-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.ml
    container_name: dd-ml-service
    environment:
      PORT: 8000
      DD_DECIDER_DATABASE_URL: postgres://postgres:postgres@postgres:5432/doordash_decider_dev
      MODEL_PATH: /models/model.pkl
      MODEL_METADATA_PATH: /models/model_metadata.json
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ml-artifacts:/models

  ml-trainer:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.ml
    container_name: dd-ml-trainer
    environment:
      DD_DECIDER_DATABASE_URL: postgres://postgres:postgres@postgres:5432/doordash_decider_dev
      MODEL_PATH: /models/model.pkl
      MODEL_METADATA_PATH: /models/model_metadata.json
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - postgres
      - mlflow
    command: ["python", "-m", "ml_service.train"]
    profiles: ["ml"]
    volumes:
      - ml-artifacts:/models
      - mlflow-data:/mlruns

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: dd-mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlruns/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlruns
    command:
      [
        "mlflow",
        "server",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--backend-store-uri",
        "sqlite:////mlruns/mlflow.db",
        "--default-artifact-root",
        "/mlruns",
      ]
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlruns

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: dd-frontend
    depends_on:
      - backend
    ports:
      - "4173:80"

  superset:
    image: apache/superset:latest
    container_name: superset
    environment:
      SUPERSET_ENV: development
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_SECRET_KEY: "gN-ha0IuGG_7W9IcMxor14hQyAnPBLzbpDRZatMTrwBgndpMuR2SE7rKMUvdl9aIg4JmJUG7pUQb4RZZ1HSnoA"
      SUPERSET_DATABASE_URI: "sqlite:////app/superset_home/superset.db"
      ANALYTICS_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/doordash_decider_dev"
    ports:
      - "8088:8088"
    depends_on:
      - postgres
    volumes:
      - superset-home:/app/superset_home

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dd-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - ml-service

  grafana:
    image: grafana/grafana:11.1.3
    container_name: dd-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  metabase:
    image: metabase/metabase:latest
    container_name: dd-metabase
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      ANALYTICS_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/doordash_decider_dev"
    ports:
      - "3001:3000"
    depends_on:
      - postgres
    volumes:
      - metabase-data:/metabase-data

volumes:
  postgres-data:
  superset-home:
  metabase-data:
  ml-artifacts:
  mlflow-data:
