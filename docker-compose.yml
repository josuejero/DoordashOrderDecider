x-fastify-env: &fastify-env
  NODE_ENV: development
  DD_DECIDER_API_PORT: ${DD_DECIDER_API_PORT}
  DATABASE_URL: ${DATABASE_URL}
  DD_DECIDER_DEV_DB_URL: ${DD_DECIDER_DEV_DB_URL}
  DD_DECIDER_TEST_DB_URL: ${DD_DECIDER_TEST_DB_URL}
  DECISION_ENGINE_URL: ${DECISION_ENGINE_URL}
  ML_SERVICE_URL: ${ML_SERVICE_URL}
  ENABLE_ANALYTICS_API: ${ENABLE_ANALYTICS_API}
  ENABLE_HYBRID_ML: ${ENABLE_HYBRID_ML}
  VITE_ENABLE_ANALYTICS_UI: ${VITE_ENABLE_ANALYTICS_UI}

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  decision-engine:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.decision-engine
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: ${DECISION_ENGINE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.server
    ports:
      - "4000:4000"
    environment: *fastify-env
    depends_on:
      - postgres
      - decision-engine

  fastify-migrations:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.server
      target: build
    profiles:
      - tools
    environment: *fastify-env
    depends_on:
      - postgres
      - decision-engine

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  ml-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ml
    ports:
      - "8000:8000"
    profiles:
      - ml
    depends_on:
      - postgres

volumes:
  postgres-data:
